name: AI Video Studio

on:
  push:
    paths: ["ai-video-studio/**", ".github/workflows/ai-video-studio.yml"]
    tags: ["studio-v*"]
  pull_request:
    paths: ["ai-video-studio/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: ai-video-studio

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ai-video-studio/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  release:
    # Builds installers: .msi/.exe (Windows), universal .dmg (macOS Intel + Apple Silicon).
    # Branch pushes upload them as workflow artifacts; tags studio-v* also create a draft release.
    if: github.event_name != 'pull_request'
    needs: check
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ai-video-studio/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "ai-video-studio/src-tauri -> target" }
      - run: npm ci
      - run: node scripts/fetch-ffmpeg.mjs ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing/notarisation: add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID here once you have
          # an Apple Developer account. Without them the app is ad-hoc signed.
        with:
          projectPath: ai-video-studio
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "AI Video Studio ${{ github.ref_name }}"
          releaseDraft: true
          includeUpdaterJson: false
          args: "--config src-tauri/tauri.release.conf.json ${{ matrix.args }}"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Studio-${{ matrix.platform == 'macos-latest' && 'macOS' || 'Windows' }}
          path: |
            ai-video-studio/src-tauri/target/**/release/bundle/msi/*.msi
            ai-video-studio/src-tauri/target/**/release/bundle/nsis/*.exe
            ai-video-studio/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
